<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Public frontier AI governance framework coverage matrix</title>
<desc id="desc">A document-coding matrix comparing OpenAI, Anthropic, Meta, and Google DeepMind across seven governance mechanisms. Explicit means the mechanism is clearly documented in the reviewed public framework; conditional or partial means present with limits; not located means the research review did not find an explicit commitment in the reviewed public documents. This is not a safety score.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:31px;font-weight:700}.s{font-size:17px}.row{font-size:20px;font-weight:700}.c{font-size:16px;text-anchor:middle}
.grid{stroke:#111;stroke-width:1.5}.yes{fill:#d0d0d0}.partial{fill:#ededed}.unknown{fill:#fff}
</style>
<rect width="1600" height="900" fill="#fff"/>
<text x="55" y="58" class="h">Public-framework coverage: documented governance mechanisms</text>
<text x="55" y="90" class="s">ECHO coding of reviewed public documents, September 23, 2026 · Not a safety ranking or claim about undisclosed internal controls</text>

<text x="250" y="155" class="row">Organization</text>
<text x="520" y="145" class="c">Capability</text><text x="520" y="166" class="c">thresholds</text>
